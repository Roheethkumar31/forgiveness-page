<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Invitation 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #fce4ec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
      text-align: center;
      position: relative;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .pug-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #f8bbd0;
    }

    h1 {
      color: #ad1457;
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    .sub-text {
      color: #666;
      font-size: 0.95rem;
      margin-top: -10px;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 60px;
      position: relative;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1rem;
    }

    .btn-yes, .btn-primary {
      background-color: #e91e63;
      color: white;
    }

    .btn-yes:hover, .btn-primary:hover {
      background-color: #c2185b;
      transform: scale(1.05);
    }

    .btn-no {
      background-color: #f8bbd0;
      color: #ad1457;
      position: relative;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- PAGE 1: Forgiveness Question -->
    <div class="step active" id="step-1">
      <img src="cat.jpg" alt="Cutest Cat" class="pug-img">
      <h1>🌸 Have you forgiven me? 🌸</h1>
      <div class="btn-container">
        <button class="btn-yes" onclick="nextStep(2)">YES ♥</button>
        <button class="btn-no" id="no-btn" onmouseover="dodgeButton()" onclick="dodgeButton()">no 🐾</button>
      </div>
    </div>

    <!-- PAGE 2: Thank You Message -->
 <div class="step" id="step-2">
      <div style="font-size: 3rem; margin-bottom: 10px;">🥹❤️</div>
      <h1>You really mean it??</h1>
      <p class="sub-text">I was so worried about it. Thank you for giving me another chance 💖</p>
      
      <!-- Main Action Button -->
      <button class="btn-primary" style="width: 100%;" onclick="alert('Sending you a big hug! ❤️')">Yay! Can't wait to see you 😄</button>
      
      <!-- SOLUTION 1: Add this Back Button right here -->
      <button type="button" class="btn-secondary" onclick="nextStep(1)" style="background: transparent; border: none; color: #888; text-decoration: underline; margin-top: 15px; font-size: 0.85rem; cursor: pointer; width: 100%;">← Go back</button>
    </div>

  </div>

  <script>
    function nextStep(stepNumber) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById('step-' + stepNumber).classList.add('active');
    }

    // Runaway "No" Button Logic
    function dodgeButton() {
      const btn = document.getElementById('no-btn');
      btn.style.position = 'fixed';
      
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      
      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;
    }
  </script>
</body>
</html>
